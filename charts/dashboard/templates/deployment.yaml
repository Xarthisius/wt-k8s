apiVersion: apps/v1    
kind: Deployment    
metadata:    
  name: {{ .Chart.Name }}    
spec:    
  replicas: 1    
  selector:    
    matchLabels:    
      app: {{ .Chart.Name }}    
  template:    
    metadata:    
      labels:    
        app: {{ .Chart.Name }}    
    spec:    
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:    
        - name: {{ .Chart.Name }}    
          image: xarthisius/wt-dashboard@sha256:2558a58f7d225c4c01ad9ecff4586ce5441c6269853c799c5b539e088f43d3ae
          ports:    
            - containerPort: 8080
          resources:
            limits:
              cpu: 750m
              memory: 768Mi
            requests:
              cpu: 500m
              ephemeral-storage: 50Mi
              memory: 512Mi
          env:    
            - name: GIRDER_API_URL
              value: {{ .Values.girderApiUrl | quote }}    
            - name: AUTH_PROVIDER    
              value: {{ .Values.authProvider }}
            - name: DATAONE_URL
              value: "https://cn.dataone.org/cn/v2"
            - name: RTD_URL
              value: {{ .Values.docsUrl }}
            - name: DASHBOARD_DEV
              value: {{ .Values.dashboardDev | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
