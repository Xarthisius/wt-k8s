environments:
  local:
    values:
    - environments/local.yaml
  jhu:
    values:
    - environments/jhu.yaml
  home:
    values:
    - environments/home.yaml

---

repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami
  - name: traefik
    url: https://traefik.github.io/charts
  - name: twuni
    url: https://helm.twun.io

releases:
  - name: mongodb
    namespace: imqcam
    createNamespace: false
    version: 14.7.2
    chart: bitnami/mongodb
    values:
      - values/mongodb-values.yaml.gotmpl

  - name: girder
    namespace: imqcam
    createNamespace: false
    chart: ./charts/girder
    values:
      - values/girder-values.yaml.gotmpl
    needs:
      - mongodb
      - redis
  
  - name: dashboard
    namespace: imqcam
    createNamespace: false
    chart: ./charts/dashboard
    values:
      - values/dashboard-values.yaml.gotmpl

  - name: docs
    namespace: imqcam
    createNamespace: false
    chart: ./charts/docs
    values:
      - values/docs-values.yaml.gotmpl

  - name: traefik
    installed: {{ eq .Environment.Name "home" | toYaml }}
    namespace: imqcam
    createNamespace: false
    chart: traefik/traefik
    values:
      - values/traefik-values.yaml.gotmpl

  - name: redis
    namespace: imqcam
    createNamespace: false
    version: 18.8.2
    chart: bitnami/redis
    values:
      - values/redis-values.yaml

  - name: gwvolman
    namespace: imqcam
    createNamespace: false
    chart: ./charts/gwvolman
    needs:
      - redis
    values:
      - values/gwvolman-values.yaml.gotmpl

  - name: registry
    namespace: imqcam
    createNamespace: false
    chart: twuni/docker-registry
    values:
      - values/registry-values.yaml.gotmpl
    jsonPatches:
      - target:
          kind: Deployment
          version: v1
          name: registry-docker-registry
          namespace: imqcam
        patch:
          - op: add
            path: /spec/template/spec/containers/0/volumeMounts/2/subPath
            value: registry
